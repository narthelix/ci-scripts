# Quarantined tests (handbook ADR-0141, narthelix/ops#2089 T28). Reads the repository's
# quarantine list, turns the step red when an entry has run out or is malformed, and hands the
# test command what it needs: a jest/vitest `--testNamePattern` that leaves the quarantined tests
# out of the gating run (`exclude`), one that runs only them (`only`, for a non-blocking job that
# still sends their results to Loki), and the quarantined files.
#
# A missing list is an empty quarantine: every output is empty, and the step is green.
name: quarantine
description: Check the quarantine list and give the gating and non-blocking runs their filters.

inputs:
  file:
    description: The quarantine list, relative to the working directory.
    required: false
    default: .github/quarantine.json
  working_directory:
    description: Where the list is (default the workspace).
    required: false
    default: '.'

outputs:
  exclude:
    description: --testNamePattern for the gating run (empty = nothing quarantined).
    value: ${{ steps.q.outputs.exclude }}
  only:
    description: --testNamePattern for the quarantined tests alone (empty = none).
    value: ${{ steps.q.outputs.only }}
  files:
    description: The quarantined files, space separated.
    value: ${{ steps.q.outputs.files }}

runs:
  using: composite
  steps:
    - name: Quarantine
      id: q
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        FILE: ${{ inputs.file }}
      run: |
        set -euo pipefail
        script="$GITHUB_ACTION_PATH/../../quarantine.py"
        python3 "$script" check "$FILE"
        {
          echo "exclude=$(python3 "$script" jest-pattern "$FILE" --exclude)"
          echo "only=$(python3 "$script" jest-pattern "$FILE" --only)"
          echo "files=$(python3 "$script" files "$FILE" | tr '\n' ' ' | sed 's/ $//')"
        } >> "$GITHUB_OUTPUT"
