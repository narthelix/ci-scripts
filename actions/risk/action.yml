# Risk class (handbook ADR-0128) + auto-merge of Ship/Show (narthelix/ops#2050).
#
# Paths plus diffs: most classes come from the path, migrations and CI
# workflows from their effect (narthelix/ops#2055).
#
# Split out of pr-conventions so `gates.yml` can run it LAST: a step after a
# failed one is skipped, so a red secret scan or lint never enables an
# auto-merge. The class is computed from the changed paths, never chosen by
# the author. It runs for bot PRs too -- Renovate's own automerge still
# governs those, the label only records the class. It never fails the job: a
# labelling error must not turn every PR red. One exception: a PR escalated to
# Ask while auto-merge was being enabled, when turning it back off fails --
# then a red gate is the only thing between that PR and a merge.
#
# `risk_class.py` comes from this action's own checkout -- the commit the
# caller pinned. It used to be fetched by a separately pinned `risk_script_ref`
# because a workflow cannot know its own commit; an action path can.
name: risk
description: Label the PR risk:ship|show|ask and auto-merge Ship/Show through the merger App.

inputs:
  risk_ask_paths:
    description: Space-separated extra regexes that make a PR Ask.
    required: false
    default: ''
  risk_floor:
    description: Lowest class any PR in this repository can get.
    required: false
    default: 'ship'
  exempt:
    description: "'true' when the PR author is an exempt bot (pr-conventions output)."
    required: false
    default: 'false'
  merger_client_id:
    description: Client ID of the merger App. Empty, nothing is auto-merged.
    required: false
    default: ''
  merger_private_key:
    description: >-
      Private key of the merger App. An App token, not GITHUB_TOKEN: a merge
      made with GITHUB_TOKEN starts no workflow run, so main's deploy would
      silently never happen.
    required: false
    default: ''

outputs:
  risk_class:
    description: ship | show | ask
    value: ${{ steps.risk.outputs.class }}

runs:
  using: composite
  steps:
    - name: Classify risk (Ship / Show / Ask)
      id: risk
      if: github.event_name == 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        NUM: ${{ github.event.pull_request.number }}
        EVENT_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        ASK_PATHS: ${{ inputs.risk_ask_paths }}
        FLOOR: ${{ inputs.risk_floor }}
      run: |
        set -uo pipefail
        script="$GITHUB_ACTION_PATH/../../risk_class.py"
        [ -f "$script" ] || { echo "::warning::risk_class.py missing next to the action"; exit 0; }
        # LIVE labels, not the event's snapshot (narthelix/ops#2099). The snapshot
        # is taken when the PR is opened; plan-risk adds `risk:escalated` a minute
        # later, and this step -- finishing after it -- read the stale list, wrote
        # `show` and removed the escalation (infra-terraform#124, 2026-10-15). The
        # apply-time guard then refused the delete, as designed.
        live() { gh api "repos/${REPO}/issues/${NUM}/labels" --jq '[.[].name] | join(",")'; }
        LABELS=$(live 2>/dev/null) || LABELS="$EVENT_LABELS"
        # The diff travels with each path: migrations and workflows are judged
        # by what they do (ADR-0128 amendment, narthelix/ops#2055). GitHub
        # omits `patch` on very large files; the classifier fails closed then.
        out=$(gh api "repos/${REPO}/pulls/${NUM}/files" --paginate --jq '.[] | {status, filename, patch} | @json' \
          | python3 "$script" --labels "$LABELS" --ask-paths "$ASK_PATHS" --floor "$FLOOR")
        cls=$(sed -n 's/^class=//p' <<< "$out")
        [ -n "$cls" ] || { echo "::warning::risk classification failed"; exit 0; }
        # Re-read before ANY output: an escalation that landed while the classifier
        # ran must still win -- for the label, and for the merger steps below that
        # read `class`. Nothing here ever lowers `risk:escalated`.
        case ",$(live 2>/dev/null)," in *,risk:escalated,*) cls=ask ;; esac
        echo "class=$cls" >> "$GITHUB_OUTPUT"
        { echo "### Risk class: \`$cls\` (ADR-0128)"; sed -n 's/^reason=/- /p' <<< "$out"; } >> "$GITHUB_STEP_SUMMARY"
        for c in ship show ask; do
          gh label create "risk:$c" -R "$REPO" --color "$( [ $c = ask ] && echo d93f0b || ([ $c = show ] && echo fbca04 || echo 0e8a16))" \
            --description "ADR-0128 risk class, set by pr-conventions" 2>/dev/null || true
          [ "$c" = "$cls" ] && continue
          gh pr edit "$NUM" -R "$REPO" --remove-label "risk:$c" >/dev/null 2>&1 || true
        done
        gh pr edit "$NUM" -R "$REPO" --add-label "risk:$cls" >/dev/null || echo "::warning::could not set label risk:$cls"

    # ADR-0128 S2: Ship and Show merge themselves once every required check is
    # green. Ask is left alone -- only the founder enables a merge there. Bot
    # PRs are skipped: Renovate and the AI doc flow manage their own
    # auto-merge. The token is narrowed to this one repository.
    - name: Mint merger token (Ship / Show)
      id: merger
      if: >-
        github.event_name == 'pull_request' && !github.event.pull_request.draft &&
        (steps.risk.outputs.class == 'ship' || steps.risk.outputs.class == 'show') &&
        inputs.exempt == 'false' && inputs.merger_client_id != ''
      continue-on-error: true
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: ${{ inputs.merger_client_id }}
        private-key: ${{ inputs.merger_private_key }}
        repositories: ${{ github.event.repository.name }}
        permission-contents: write
        permission-pull-requests: write

    - name: Enable auto-merge (Ship / Show)
      if: steps.merger.outputs.token != ''
      shell: bash
      env:
        GH_TOKEN: ${{ steps.merger.outputs.token }}
        REPO: ${{ github.repository }}
        NUM: ${{ github.event.pull_request.number }}
        CLS: ${{ steps.risk.outputs.class }}
      run: |
        set -uo pipefail
        # The plan job (actions/plan-risk) can escalate this PR to Ask while gates
        # run: read the LIVE labels before enabling, and again after -- an
        # escalation that landed in between turns the merge back off. Fail closed:
        # labels that cannot be read count as Ask.
        ask() {
          l=$(gh api "repos/${REPO}/issues/${NUM}/labels" --jq '[.[].name] | join(",")') || return 0
          case ",$l," in *,risk:ask,*|*,risk:escalated,*) return 0 ;; esac
          return 1
        }
        if ask; then
          echo "::notice::PR is now Ask -- auto-merge not enabled"
          exit 0
        fi
        # No --delete-branch: every repository deletes merged branches itself
        # (delete_branch_on_merge, infra-terraform), and with a merge queue gh
        # refuses the flag -- the whole call failed on gitops (narthelix/ops#2089 T24).
        if ! gh pr merge "$NUM" -R "$REPO" --auto --squash; then
          echo "::warning::could not enable auto-merge (branch protection / allow_auto_merge?)"
          exit 0
        fi
        if ask; then
          gh pr merge "$NUM" -R "$REPO" --disable-auto \
            || { echo "::error::PR became Ask while auto-merge was enabled, and disabling failed"; exit 1; }
          echo "::notice::PR became Ask meanwhile -- auto-merge turned back off"
          exit 0
        fi
        echo "::notice::risk:${CLS} -- auto-merge enabled; merges when every required check is green"
