# Contract: handbook engineering/pipelines.md.
#
# ---------------------------------------------------------------------------
# GITHUB-HOSTED RUNNER, self-hosted DEGIL -- tercih degil, zorunluluk
# (narthelix/muznara#918). Org'un runner grubu `allows_public_repositories:
# false` tasiyor, yani bu PUBLIC repo o makineyi zaten alamaz ve
# `[self-hosted, ...]` etiketiyle isler sonsuza kadar kuyrukta beklerdi.
# Ayar da dogru ayar: fork'tan acilan bir PR `pull_request` icin workflow'u
# PR'in kendi hâliyle kosturuyor, yani `runs-on`'u degistirebiliyor -- kalici
# bir runner'da bu, bir kez zehirlenip sonraki isleri kirletmek demek.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      # Stdlib only, by design: this is fetched and run by every repo's CI, so
      # a dependency here becomes a dependency everywhere -- and a supply-chain
      # surface on a tool that reads our documents.
      - run: python3 test_docs_check.py
      - run: python3 test_trace_check.py
      - run: python3 test_dead_jobs.py
      - run: python3 test_ghcr_prune.py
      - run: python3 test_storage_usage.py
      - run: python3 test_risk_class.py
      - run: python3 test_tf_plan_risk.py
      - run: python3 test_test_results.py
      - run: python3 test_quarantine.py
      - run: python3 test_badge.py
      # Eat our own cooking: the checker runs against this repository too.
      - run: python3 docs_check.py --root .

  # Same-repo reference, deliberately: this repo is public, and a public
  # repository cannot call a reusable workflow in a private one. That is why
  # these two gates were moved here in the first place (ADR-0099) -- and why
  # this file must never point back at the private repo. `./` also means the
  # gate a PR proposes is the gate that PR runs, which is the right property
  # for the repo that owns them.
  pr-conventions:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write  # risk:* label (ADR-0128)
    uses: ./.github/workflows/pr-conventions.yml
    with:
      # Shared CI for every repository: any change here is Ask (ADR-0128).
      risk_floor: ask
      # Issues live in narthelix/muznara's tracker; the branch name carries the
      # number, and a bare `#N` here would resolve against this repo.
      require_issue_link: false
      runner: ubuntu-latest  # public repo -- rationale at the top of this file

  secret-scan:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/secret-scan.yml
    with:
      runner: ubuntu-latest  # public repo -- rationale at the top of this file

  actions-lint:
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/actions-lint.yml
    with:
      runner: ubuntu-latest  # public repo -- rationale at the top of this file

  # All four gates in one job (narthelix/ops#2050). Runs beside the per-check
  # workflows above while callers migrate, so a PR here exercises both.
  gates:
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/gates.yml
    with:
      risk_floor: ask
      require_issue_link: false
      runner: ubuntu-latest  # public repo -- rationale at the top of this file

  # The one required check, `ci` (ADR-0143, narthelix/ops#2170 U12): the merge queue
  # tests the PR on top of the latest main, so no branch update is needed. Skipped
  # counts as passed; anything else fails.
  ci:
    if: always()
    needs: [test, pr-conventions, secret-scan, actions-lint, gates]
    runs-on: [self-hosted, linux, ARM64, israel]
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "::error::a required job: $r"; exit 1 ;; esac
          done
