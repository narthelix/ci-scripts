# Reusable gitleaks secret scan.
#
# Language-agnostic: this is a company rule, and it matters most in the repos
# that hold no application code at all — infrastructure and GitOps trees are
# where a plaintext credential is both most likely and most costly.
#
# ---------------------------------------------------------------------------
# WHY THIS LIVES IN A PUBLIC REPOSITORY (ADR-0097, ADR-0099)
#
# A workflow in a public repository cannot call a reusable workflow stored in a
# private one. GitHub reports that as `workflow was not found`, and the run
# never starts: no jobs are created, so the repository looks quiet rather than
# broken. A security gate that has silently never run is worse than a missing
# one, because the green board says otherwise.
#
# `runner` therefore has NO DEFAULT. The org's runner labels are infrastructure
# detail and stay with the caller, which is where the scope lock puts them. A
# default would also be the wrong shape of failure: a caller that forgot the
# input would quietly move onto billed hosted minutes instead of failing.
name: secret-scan

on:
  workflow_call:
    inputs:
      runner:
        description: >-
          runs-on value. Plain label or a JSON array as a string. Required: this
          repository is public and holds no runner labels of its own.
        required: true
        type: string
      gitleaks_version:
        required: false
        type: string
        default: '8.30.1'
      config_path:
        description: 'Calibration file, shared with the pre-commit hook. Skipped if absent.'
        required: false
        type: string
        default: '.gitleaks.toml'
      skip_paths:
        description: >-
          Space-separated path prefixes. A PR touching ONLY these is skipped
          (skipped-as-Success keeps a required check green). Empty — the default
          — never skips, which is what a docs/config repo wants: there
          "docs-only" is every PR, and the skip would disable the gate entirely.
        required: false
        type: string
        default: ''

jobs:
  scan:
    runs-on: ${{ startsWith(inputs.runner, '[') && fromJSON(inputs.runner) || inputs.runner }}
    timeout-minutes: 10
    permissions:
      # The MIT gitleaks CLI runs entirely locally (no GitHub API calls), so
      # least-privilege is just read for checkout.
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # The steps live in `actions/` (narthelix/ops#2050), shared with
      # gates.yml; taken from this workflow's own commit, so a caller pinned to
      # a SHA gets that SHA's checks.
      - name: ci-scripts at this workflow's commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .narthelix-ci-scripts
          sparse-checkout: |
            actions
            gitleaks
          persist-credentials: false

      - name: secret-scan
        uses: ./.narthelix-ci-scripts/actions/secret-scan
        with:
          gitleaks_version: ${{ inputs.gitleaks_version }}
          config_path: ${{ inputs.config_path }}
          skip_paths: ${{ inputs.skip_paths }}
