# Reusable gitleaks secret scan.
#
# Language-agnostic: this is a company rule, and it matters most in the repos
# that hold no application code at all — infrastructure and GitOps trees are
# where a plaintext credential is both most likely and most costly.
#
# ---------------------------------------------------------------------------
# WHY THIS LIVES IN A PUBLIC REPOSITORY (ADR-0097, ADR-0099)
#
# A workflow in a public repository cannot call a reusable workflow stored in a
# private one. GitHub reports that as `workflow was not found`, and the run
# never starts: no jobs are created, so the repository looks quiet rather than
# broken. A security gate that has silently never run is worse than a missing
# one, because the green board says otherwise.
#
# `runner` therefore has NO DEFAULT. The org's runner labels are infrastructure
# detail and stay with the caller, which is where the scope lock puts them. A
# default would also be the wrong shape of failure: a caller that forgot the
# input would quietly move onto billed hosted minutes instead of failing.
name: secret-scan

on:
  workflow_call:
    inputs:
      runner:
        description: >-
          runs-on value. Plain label or a JSON array as a string. Required: this
          repository is public and holds no runner labels of its own.
        required: true
        type: string
      gitleaks_version:
        required: false
        type: string
        default: '8.30.1'
      config_path:
        description: 'Calibration file, shared with the pre-commit hook. Skipped if absent.'
        required: false
        type: string
        default: '.gitleaks.toml'
      skip_paths:
        description: >-
          Space-separated path prefixes. A PR touching ONLY these is skipped
          (skipped-as-Success keeps a required check green). Empty — the default
          — never skips, which is what a docs/config repo wants: there
          "docs-only" is every PR, and the skip would disable the gate entirely.
        required: false
        type: string
        default: ''

jobs:
  scan:
    runs-on: ${{ startsWith(inputs.runner, '[') && fromJSON(inputs.runner) || inputs.runner }}
    timeout-minutes: 10
    permissions:
      # The MIT gitleaks CLI runs entirely locally (no GitHub API calls), so
      # least-privilege is just read for checkout.
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Scope gate, computed in shell rather than via a paths-filter template:
      # interpolating a multiline input into the action's `filters:` string
      # drops the continuation lines' indentation and produces invalid YAML.
      # Prefix matching is equivalent for the `specs/`-style exclusions in use.
      - name: Decide whether this PR is in scope
        id: scope
        env:
          SKIP_PREFIXES: ${{ inputs.skip_paths }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ -z "${SKIP_PREFIXES// }" ] || [ "$EVENT_NAME" != "pull_request" ]; then
            echo "in_scope=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            # Base unreachable (force-push): fail open into scope rather than
            # silently skipping a gate.
            echo "in_scope=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          in_scope=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            skip=false
            for p in $SKIP_PREFIXES; do
              case "$f" in "$p"*) skip=true ;; esac
            done
            [ "$skip" = true ] || in_scope=true
          done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "in_scope=$in_scope" >> "$GITHUB_OUTPUT"

      # The gitleaks CLI, not gitleaks/gitleaks-action: the action hard-fails on
      # organization-owned repos without a registered GITLEAKS_LICENSE, which
      # broke every PR when this org's repos moved under an organization. The
      # CLI is MIT and needs no license. Pinned + arch-detected so it is
      # reproducible.
      - name: Install gitleaks (pinned, checksum-verified)
        if: steps.scope.outputs.in_scope == 'true'
        env:
          GITLEAKS_VERSION: ${{ inputs.gitleaks_version }}
        run: |
          set -euo pipefail
          os=$(uname -s | tr '[:upper:]' '[:lower:]')
          case "$(uname -m)" in
            x86_64|amd64)  arch=x64 ;;
            aarch64|arm64) arch=arm64 ;;
            *) echo "unsupported arch: $(uname -m)" >&2; exit 1 ;;
          esac
          asset="gitleaks_${GITLEAKS_VERSION}_${os}_${arch}.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          # `-L` follows redirects, so the scheme has to be pinned on the
          # redirect too: without --proto-redir a downgrade to http would be
          # followed silently. It matters most for the checksums file — that is
          # the thing the tamper check trusts.
          curl_opts=(-fsSL --proto '=https' --proto-redir '=https')
          curl "${curl_opts[@]}" "${base}/${asset}" -o "${RUNNER_TEMP}/${asset}"
          curl "${curl_opts[@]}" "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o "${RUNNER_TEMP}/checksums.txt"
          # Verify before trusting: a scanner that got corrupted or tampered and
          # exits 0 would silently pass this security gate.
          expected=$(awk -v a="${asset}" '$2==a {print $1}' "${RUNNER_TEMP}/checksums.txt")
          if command -v sha256sum >/dev/null 2>&1; then
            actual=$(sha256sum "${RUNNER_TEMP}/${asset}" | awk '{print $1}')
          else
            actual=$(shasum -a 256 "${RUNNER_TEMP}/${asset}" | awk '{print $1}')
          fi
          if [ -z "$expected" ] || [ "$expected" != "$actual" ]; then
            echo "::error::gitleaks checksum verification failed (expected=$expected actual=$actual)"
            exit 1
          fi
          tar -xzf "${RUNNER_TEMP}/${asset}" -C "${RUNNER_TEMP}" gitleaks
          chmod +x "${RUNNER_TEMP}/gitleaks"
          "${RUNNER_TEMP}/gitleaks" version

      # PR: scan only the PR's commit range (fetch-depth:0 makes both ends
      # present), falling back to full history if base.sha is unreachable (e.g.
      # the base branch was force-pushed) so the gate never spuriously fails nor
      # silently skips. Push: full-history backstop.
      - name: Scan for secrets
        if: steps.scope.outputs.in_scope == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CONFIG_PATH: ${{ inputs.config_path }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            range="--log-opts=${BASE_SHA}..${HEAD_SHA}"
          else
            range=""
          fi
          # A repo without its own calibration file runs gitleaks' defaults
          # rather than failing to start — the gate must not be skippable by
          # omission.
          if [ -f "$CONFIG_PATH" ]; then
            cfg="--config=$CONFIG_PATH"
          else
            cfg=""
            echo "::notice::$CONFIG_PATH not found — running gitleaks default rules"
          fi
          "${RUNNER_TEMP}/gitleaks" git $cfg --redact --exit-code 1 $range .
