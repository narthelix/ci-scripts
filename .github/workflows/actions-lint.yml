# Reusable GitHub Actions security lint — zizmor (MIT), narthelix/muznara#1852.
#
# Replaces SonarCloud's githubactions:* rules (SHA pinning, job permissions,
# template injection, credential persistence) at PR time, with no server and no
# LOC quota. Public for the same reason as secret-scan.yml (ADR-0097/0099): a
# public caller cannot reach a private reusable workflow, so `runner` has no
# default and stays with the caller.
#
# ---------------------------------------------------------------------------
# NEW FINDINGS ONLY, NO BASELINE FILE
#
# Measured 2026-09-26 across 27 repos: ~290 existing findings at medium+. A
# gate that is red on day one everywhere is a gate nobody reads (the lesson of
# #1516). So on a PR, zizmor's SARIF goes through reviewdog with
# `-filter-mode=added`: only findings on lines THIS PR adds or changes can fail
# it, the existing debt stays visible on main and melts through Renovate's
# SHA-pin PRs and ordinary fixes. Same pattern as Semgrep in the org's
# python-quality.yml.
#
# What fails: zizmor `high` (SARIF `error`). `medium` (SARIF `warning`) is a
# review comment, not a red check.
#
# On push to main the scan runs and REPORTS (job summary) but never fails:
# main is where the old debt lives, and a permanently red main is noise.
name: actions-lint

on:
  workflow_call:
    inputs:
      runner:
        description: >-
          runs-on value. Plain label or a JSON array as a string. Required: this
          repository is public and holds no runner labels of its own.
        required: true
        type: string
      zizmor_version:
        required: false
        type: string
        default: '1.30.1'
      min_severity:
        required: false
        type: string
        default: 'medium'

jobs:
  zizmor:
    runs-on: ${{ startsWith(inputs.runner, '[') && fromJSON(inputs.runner) || inputs.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
      # reviewdog writes the findings as PR review comments.
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # The steps live in `actions/` (narthelix/ops#2050), shared with
      # gates.yml; taken from this workflow's own commit, so a caller pinned to
      # a SHA gets that SHA's checks.
      - name: ci-scripts at this workflow's commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .narthelix-ci-scripts
          sparse-checkout: |
            actions
            gitleaks
          persist-credentials: false

      - name: zizmor
        uses: ./.narthelix-ci-scripts/actions/zizmor
        with:
          zizmor_version: ${{ inputs.zizmor_version }}
          min_severity: ${{ inputs.min_severity }}

  # shellcheck, hadolint, install-scripts (semgrep) -- the rest of what
  # SonarCloud flagged in repo plumbing (narthelix/muznara#1852). Same
  # contract as zizmor: only lines THIS PR adds can fail it. Rationale and the
  # measured baselines now sit with the steps, in actions/repo-lint.
  repo-lint:
    runs-on: ${{ startsWith(inputs.runner, '[') && fromJSON(inputs.runner) || inputs.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # The steps live in `actions/` (narthelix/ops#2050), shared with
      # gates.yml; taken from this workflow's own commit, so a caller pinned to
      # a SHA gets that SHA's checks.
      - name: ci-scripts at this workflow's commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .narthelix-ci-scripts
          sparse-checkout: |
            actions
            gitleaks
          persist-credentials: false

      - name: repo-lint
        uses: ./.narthelix-ci-scripts/actions/repo-lint
